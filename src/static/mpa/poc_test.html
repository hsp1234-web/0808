<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後端 POC 測試介面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #0056b3;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: .5rem;
            font-weight: bold;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #status-container {
            margin-top: 2rem;
            padding: 1rem;
            background-color: #e9ecef;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            min-height: 200px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: "SF Mono", "Fira Code", "Consolas", monospace;
        }
        .status-message {
            padding: 5px;
            border-bottom: 1px solid #ccc;
        }
        .status-message:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>後端 POC 測試介面</h1>
        <p>此頁面用於直接測試新的 FastAPI 後端服務。</p>

        <div class="form-group">
            <label for="youtube-url">YouTube 影片網址</label>
            <input type="text" id="youtube-url" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
        </div>

        <div class="form-group">
            <label for="api-key">Google API 金鑰</label>
            <input type="password" id="api-key" placeholder="請在此處輸入您的 API 金鑰">
        </div>

        <button id="submit-btn">提交任務</button>

        <h2>即時狀態更新</h2>
        <div id="status-container"></div>
    </div>

    <script>
        // 繁體中文註解：將所有程式碼放在一個立即執行的函式中，以避免污染全域作用域
        (function() {
            const youtubeUrlInput = document.getElementById('youtube-url');
            const apiKeyInput = document.getElementById('api-key');
            const submitBtn = document.getElementById('submit-btn');
            const statusContainer = document.getElementById('status-container');

            // 繁體中文註解：從 localStorage 讀取儲存的 API 金鑰
            const savedApiKey = localStorage.getItem('poc_api_key');
            if (savedApiKey) {
                apiKeyInput.value = savedApiKey;
            }

            submitBtn.addEventListener('click', () => {
                const url = youtubeUrlInput.value;
                const apiKey = apiKeyInput.value;

                if (!url || !apiKey) {
                    alert('請務必填寫 YouTube 網址和 API 金鑰！');
                    return;
                }

                // 繁體中文註解：將 API 金鑰儲存到 localStorage，方便下次使用
                localStorage.setItem('poc_api_key', apiKey);

                // 繁體中文註解：禁用按鈕，防止重複提交
                submitBtn.disabled = true;
                statusContainer.innerHTML = ''; // 清空舊的狀態訊息

                function addStatusMessage(message) {
                    const messageElement = document.createElement('div');
                    messageElement.className = 'status-message';
                    messageElement.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
                    statusContainer.appendChild(messageElement);
                    statusContainer.scrollTop = statusContainer.scrollHeight;
                }

                addStatusMessage('正在初始化任務...');

                // 繁體中文註解：為這次連線產生一個唯一的客戶端 ID
                const clientId = `poc-client-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;

                // 繁體中文註解：建立 WebSocket 連線
                // 我們使用 window.location.host 來動態決定主機，使其在本地和部署環境中都能運作
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${wsProtocol}//${window.location.host}/ws/${clientId}`;

                addStatusMessage(`正在連線到 WebSocket: ${wsUrl}`);
                const socket = new WebSocket(wsUrl);

                socket.onopen = function(event) {
                    addStatusMessage('✅ WebSocket 連線成功！準備提交任務...');

                    // 繁體中文註解：在 WebSocket 連線成功後，才提交 HTTP 請求
                    fetch('/api/submit_task', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            url: url,
                            api_key: apiKey,
                            client_id: clientId
                        }),
                    })
                    .then(response => response.json())
                    .then(data => {
                        addStatusMessage(`🚀 任務已成功提交到後端。任務 ID: ${data.task_id}`);
                    })
                    .catch(error => {
                        console.error('提交任務時發生錯誤:', error);
                        addStatusMessage(`❌ 提交任務時發生錯誤: ${error}`);
                        submitBtn.disabled = false; // 發生錯誤時重新啟用按鈕
                    });
                };

                socket.onmessage = function(event) {
                    try {
                        const serverMessage = JSON.parse(event.data);
                        const { status, message, data } = serverMessage;

                        let displayMessage = `[狀態: ${status}] ${message}`;
                        if (data && data.report_path) {
                            displayMessage += ` | 報告路徑: ${data.report_path}`;
                        }

                        addStatusMessage(displayMessage);

                        if (status === 'completed' || status === 'failed') {
                            socket.close();
                        }
                    } catch (e) {
                        // 繁體中文註解：處理非 JSON 格式的訊息
                        addStatusMessage(`收到非標準訊息: ${event.data}`);
                    }
                };

                socket.onclose = function(event) {
                    if (event.wasClean) {
                        addStatusMessage(`🔌 WebSocket 連線已正常關閉。`);
                    } else {
                        addStatusMessage(`🔌 WebSocket 連線意外中斷。`);
                    }
                    submitBtn.disabled = false; // 任務結束後重新啟用按鈕
                };

                socket.onerror = function(error) {
                    console.error('WebSocket 發生錯誤:', error);
                    addStatusMessage(`❌ WebSocket 發生錯誤: ${error.message || '未知錯誤'}`);
                    submitBtn.disabled = false; // 發生錯誤時重新啟用按鈕
                };
            });
        })();
    </script>

</body>
</html>
