<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 轉報告 - 音訊轉錄儀</title>
    <link rel="stylesheet" href="/static/shared/main.css">
</head>
<body>
    <div id="app" class="container">
        <!-- 全域標頭 (共享) -->
        <header class="global-header">
            <div class="header-top-row">
                <h1 id="page-title">YouTube 轉報告</h1>
                <div class="perf-dashboard">
                    <div class="stat-item">
                        <span id="status-light" class="status-light"></span>
                        <span id="status-text">連線中...</span>
                    </div>
                    <div class="stat-item" id="gpu-stat-container" style="display: none;">
                        <span>GPU</span>
                        <strong id="gpu-label">--%</strong>
                    </div>
                    <div class="stat-item">
                        <span>CPU</span>
                        <strong id="cpu-label">--%</strong>
                    </div>
                    <div class="stat-item">
                        <span>RAM</span>
                        <strong id="ram-label">--%</strong>
                    </div>
                </div>
            </div>
            <nav class="nav-buttons">
                <a href="/static/index.html" class="nav-button" data-page="index">儀表板</a>
                <a href="/static/transcribe.html" class="nav-button" data-page="transcribe">本地轉錄</a>
                <a href="/static/downloader.html" class="nav-button" data-page="downloader">媒體下載器</a>
                <a href="/static/youtube_report.html" class="nav-button" data-page="youtube_report">YouTube 報告</a>
                <a href="/static/prompts.html" class="nav-button" data-page="prompts">提示詞管理</a>
            </nav>
        </header>

        <!-- 狀態訊息區 (共享) -->
        <div id="status-message-area" class="card" style="display:none;">
            <div id="status-message-text"></div>
        </div>

        <!-- === YouTube 轉報告專屬內容 === -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
                <h2>🔑 Google API 金鑰管理</h2>
                <a href="/static/prompts.html" class="nav-button" style="background-color: var(--button-secondary-bg-color); color: white;">管理提示詞 &rarr;</a>
            </div>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px;">
                <input type="password" id="api-key-input" data-testid="api-key-input" placeholder="在此貼上您的 Google API 金鑰" class="form-input" style="flex-grow: 1;">
                <button id="save-api-key-btn" data-testid="save-api-key-button">儲存金鑰</button>
                <button id="clear-api-key-btn" style="background-color: #6c757d;">清除</button>
            </div>
            <p id="api-key-status" style="margin-top: 8px; font-weight: 500;">狀態: <span style="font-style: italic;">尚未提供金鑰</span></p>
        </div>

        <div class="card">
            <h2>▶️ 輸入 YouTube 影片</h2>
            <fieldset id="youtube-controls-fieldset" disabled>
                <div id="youtube-link-list" class="flex-col" style="gap: 10px;">
                    <div class="youtube-link-row" style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
                        <input type="text" class="youtube-url-input form-input" placeholder="YouTube 影片網址" style="flex: 1 1 400px;">
                        <input type="text" class="youtube-filename-input form-input" placeholder="自訂檔名 (可選)" style="flex: 1 1 200px;">
                        <button class="remove-youtube-row-btn" style="background-color: var(--status-red); padding: 10px 15px; flex-shrink: 0; line-height: 1; font-size: 1.2em;">×</button>
                    </div>
                </div>
                <button id="add-youtube-row-btn" data-testid="add-youtube-row-button" style="margin-top: 12px;">+ 新增一列</button>
            </fieldset>
        </div>

        <div class="card">
            <h2>⚙️ 參數控制區</h2>
            <fieldset id="youtube-params-fieldset" disabled>
                <div class="grid-2-col">
                    <div>
                        <label><strong>任務選項</strong></label>
                        <div id="yt-tasks-group" style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
                            <label><input type="checkbox" name="yt-task" value="summary" checked> 重點摘要</label>
                            <label><input type="checkbox" name="yt-task" value="transcript" checked> 詳細逐字稿</label>
                            <label><input type="checkbox" name="yt-task" value="translate"> 使用原文 (基於逐字稿)</label>
                            <label><input type="checkbox" name="yt-task" value="translate_zh"> 翻譯成繁體中文 (基於逐字稿)</label>
                        </div>
                    </div>
                    <div class="flex-col">
                        <div>
                            <label for="gemini-model-select"><strong>AI 模型</strong></label>
                            <select id="gemini-model-select" data-testid="gemini-model-select" class="form-select">
                                <option>等待從伺服器載入模型列表...</option>
                            </select>
                        </div>
                        <div>
                            <label for="yt-output-format-select"><strong>輸出格式</strong></label>
                            <select id="yt-output-format-select" class="form-select">
                                <option value="html">HTML 報告</option>
                                <option value="txt">純文字 (.txt)</option>
                            </select>
                        </div>
                    </div>
                </div>
                 <div style="text-align: center; margin-top: 24px;">
                    <button id="start-youtube-processing-btn" data-testid="start-youtube-processing-button" disabled>🚀 分析影片 (Gemini)</button>
                </div>
            </fieldset>
        </div>

        <div class="card">
            <h2>📊 YouTube 報告瀏覽區</h2>
            <div id="youtube-file-browser" class="task-list">
                <p id="no-youtube-report-msg">尚無已完成的報告</p>
            </div>
        </div>

        <!-- 處理中任務 (共享) -->
        <div class="card">
            <h3>🔄 處理中任務</h3>
            <div id="ongoing-tasks" class="task-list">
                <p>正在載入任務...</p>
            </div>
        </div>

        <!-- 已完成任務 (共享) -->
        <div class="card">
            <h3>✅ 已完成任務</h3>
            <div id="completed-tasks" class="task-list">
                <p>正在載入任務...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { AppInitializer } from '/static/shared/app.js';

        // 此處為 youtube_report.html 頁面專屬的邏輯
        document.addEventListener('DOMContentLoaded', () => {
            const apiKeyInput = document.getElementById('api-key-input');
            const saveApiKeyBtn = document.getElementById('save-api-key-btn');
            const clearApiKeyBtn = document.getElementById('clear-api-key-btn');
            const apiKeyStatus = document.getElementById('api-key-status')?.querySelector('span');
            const startYoutubeProcessingBtn = document.getElementById('start-youtube-processing-btn');
            const geminiModelSelect = document.getElementById('gemini-model-select');
            const youtubeControlsFieldset = document.getElementById('youtube-controls-fieldset');
            const addYoutubeRowBtn = document.getElementById('add-youtube-row-btn');
            const youtubeLinkList = document.getElementById('youtube-link-list');
            const ytOutputFormatSelect = document.getElementById('yt-output-format-select');

            function updateApiKeyUI(state, message) {
                if (!apiKeyStatus) return;
                apiKeyStatus.style.color = 'inherit';
                apiKeyStatus.style.fontStyle = 'normal';

                const isValid = state === 'valid';
                if(startYoutubeProcessingBtn) startYoutubeProcessingBtn.disabled = !isValid;
                if(youtubeControlsFieldset) youtubeControlsFieldset.disabled = !isValid;

                switch (state) {
                    case 'valid':
                        apiKeyStatus.textContent = message || '驗證成功';
                        apiKeyStatus.style.color = 'var(--status-green)';
                        break;
                    case 'invalid':
                        apiKeyStatus.textContent = message || '驗證失敗';
                        apiKeyStatus.style.color = 'var(--status-red)';
                        break;
                    case 'validating':
                        apiKeyStatus.textContent = message || '正在驗證中...';
                        apiKeyStatus.style.fontStyle = 'italic';
                        break;
                    case 'not_provided':
                    default:
                        apiKeyStatus.textContent = message || '尚未提供金鑰';
                        apiKeyStatus.style.fontStyle = 'italic';
                        break;
                }
            }

            async function validateAndLoadModels() {
                const apiKey = localStorage.getItem('googleApiKey');
                if (!apiKey) {
                    updateApiKeyUI('not_provided');
                    if(geminiModelSelect) geminiModelSelect.innerHTML = '<option>請先儲存有效的金鑰</option>';
                    return;
                }

                updateApiKeyUI('validating');
                try {
                    const response = await fetch('/api/youtube/models', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ api_key: apiKey }),
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.detail || '伺服器錯誤');

                    updateApiKeyUI('valid', '金鑰有效');
                    if(geminiModelSelect) {
                        geminiModelSelect.innerHTML = '';
                        result.models.forEach(model => {
                            const option = document.createElement('option');
                            option.value = model.id;
                            option.textContent = model.name;
                            if (model.id.includes('1.5-flash')) { // 預設選中 Flash 模型
                                option.selected = true;
                            }
                            geminiModelSelect.appendChild(option);
                        });
                    }
                } catch (error) {
                    updateApiKeyUI('invalid', error.message);
                    if(geminiModelSelect) geminiModelSelect.innerHTML = '<option>金鑰無效或載入失敗</option>';
                }
            }

            saveApiKeyBtn.addEventListener('click', () => {
                const apiKey = apiKeyInput.value.trim();
                if (apiKey) {
                    localStorage.setItem('googleApiKey', apiKey);
                    validateAndLoadModels();
                } else {
                    AppInitializer.showStatusMessage('API 金鑰不能為空', true);
                }
            });

            clearApiKeyBtn.addEventListener('click', () => {
                localStorage.removeItem('googleApiKey');
                apiKeyInput.value = '';
                updateApiKeyUI('not_provided');
            });

            addYoutubeRowBtn.addEventListener('click', () => {
                const newRow = youtubeLinkList.querySelector('.youtube-link-row').cloneNode(true);
                newRow.querySelector('.youtube-url-input').value = '';
                newRow.querySelector('.youtube-filename-input').value = '';
                youtubeLinkList.appendChild(newRow);
            });

            youtubeLinkList.addEventListener('click', (e) => {
                if (e.target.classList.contains('remove-youtube-row-btn')) {
                    if (youtubeLinkList.querySelectorAll('.youtube-link-row').length > 1) {
                        e.target.closest('.youtube-link-row').remove();
                    } else {
                        AppInitializer.showStatusMessage('至少需要保留一列。', true);
                    }
                }
            });

            startYoutubeProcessingBtn.addEventListener('click', async () => {
                const requests = Array.from(youtubeLinkList.querySelectorAll('.youtube-link-row')).map(row => ({
                    url: row.querySelector('.youtube-url-input').value.trim(),
                    custom_filename: row.querySelector('.youtube-filename-input').value.trim(),
                })).filter(req => req.url);

                if (requests.length === 0) {
                    AppInitializer.showStatusMessage('請輸入至少一個有效的 YouTube 網址。', true);
                    return;
                }

                const selectedTasks = Array.from(document.querySelectorAll('input[name="yt-task"]:checked')).map(cb => cb.value);
                if (selectedTasks.length === 0) {
                    AppInitializer.showStatusMessage('請至少選擇一個 AI 分析任務。', true);
                    return;
                }

                const payload = {
                    requests: requests,
                    model: geminiModelSelect.value,
                    download_only: false,
                    tasks: selectedTasks.join(','),
                    output_format: ytOutputFormatSelect.value,
                    api_key: localStorage.getItem('googleApiKey')
                };

                startYoutubeProcessingBtn.disabled = true;
                startYoutubeProcessingBtn.textContent = '正在建立任務...';

                try {
                    const response = await fetch('/api/youtube/process', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error((await response.json()).detail);

                    AppInitializer.showStatusMessage(`${requests.length} 個 YouTube 分析任務已成功建立！`, false);
                    youtubeLinkList.querySelectorAll('.youtube-link-row').forEach((row, index) => {
                        if (index === 0) {
                            row.querySelector('.youtube-url-input').value = '';
                            row.querySelector('.youtube-filename-input').value = '';
                        } else {
                            row.remove();
                        }
                    });
                } catch (error) {
                    AppInitializer.showStatusMessage(`處理 YouTube 任務時發生錯誤: ${error.message}`, true);
                } finally {
                    startYoutubeProcessingBtn.disabled = false;
                    startYoutubeProcessingBtn.textContent = '🚀 分析影片 (Gemini)';
                }
            });


            // Initial load
            const storedApiKey = localStorage.getItem('googleApiKey');
            if (storedApiKey) {
                apiKeyInput.value = storedApiKey;
                validateAndLoadModels();
            } else {
                updateApiKeyUI('not_provided');
            }
        });

        // 初始化共享應用程式邏輯
        AppInitializer.init({ pageId: 'youtube_report' });
    </script>

    <!-- Modals -->
    <div id="preview-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">預覽</h2>
                <button id="modal-close-btn" class="modal-close-button">&times;</button>
            </div>
            <div class="modal-body"></div>
            <div class="modal-footer">
                <button id="modal-copy-link-btn">複製連結</button>
            </div>
        </div>
    </div>

    <div id="details-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="details-modal-title">任務詳細資訊</h2>
                <button id="details-modal-close-btn" class="modal-close-button">&times;</button>
            </div>
            <div id="details-modal-body" class="modal-body"></div>
            <div class="modal-footer">
                 <button id="details-modal-ok-btn">確認</button>
            </div>
        </div>
    </div>
</body>
</html>
