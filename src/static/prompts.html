<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提示詞管理 - 音訊轉錄儀</title>
    <link rel="stylesheet" href="/static/shared/main.css">
    <style>
        /* 頁面專屬的微調 */
        .container {
            max-width: 900px;
            margin: auto;
        }
        .prompt-group {
            margin-bottom: 24px;
        }
        .prompt-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1.1em;
        }
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-family: monospace;
            font-size: 0.9em;
            line-height: 1.6;
            box-sizing: border-box;
            resize: vertical;
        }
        .controls {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }
        .status-message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            text-align: center;
            font-weight: 500;
        }
        .status-message.success {
            background-color: #d4edda;
            color: #155724;
        }
        .status-message.error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container card">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <h1>提示詞管理</h1>
            <a href="/static/menu.html" class="tab-button" style="background-color: #6c757d;">&larr; 返回選單</a>
        </div>
        <p>在這裡，您可以檢視和修改系統用於與 AI 溝通的各種提示詞 (Prompts)。修改後請務必儲存。</p>

        <div id="prompts-container">
            <p>正在從伺服器載入提示詞...</p>
        </div>

        <div class="controls">
            <button id="save-btn" disabled>儲存變更</button>
        </div>
        <div id="status-area" class="status-message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const promptsContainer = document.getElementById('prompts-container');
            const saveBtn = document.getElementById('save-btn');
            const statusArea = document.getElementById('status-area');
            let originalPrompts = {};

            const fetchPrompts = async () => {
                try {
                    const response = await fetch('/api/prompts');
                    if (!response.ok) {
                        throw new Error(`伺服器錯誤: ${response.statusText}`);
                    }
                    const prompts = await response.json();
                    originalPrompts = prompts;
                    renderPrompts(prompts);
                    saveBtn.disabled = false;
                } catch (error) {
                    promptsContainer.innerHTML = `<p style="color: red;">載入提示詞失敗: ${error.message}</p>`;
                }
            };

            const renderPrompts = (prompts) => {
                promptsContainer.innerHTML = '';
                for (const key in prompts) {
                    if (Object.hasOwnProperty.call(prompts, key)) {
                        const value = prompts[key];
                        const group = document.createElement('div');
                        group.className = 'prompt-group';

                        const label = document.createElement('label');
                        label.htmlFor = `prompt-${key}`;
                        label.textContent = key;

                        const textarea = document.createElement('textarea');
                        textarea.id = `prompt-${key}`;
                        textarea.name = key;
                        textarea.value = value;

                        group.appendChild(label);
                        group.appendChild(textarea);
                        promptsContainer.appendChild(group);
                    }
                }
            };

            const showStatusMessage = (message, isError = false) => {
                statusArea.textContent = message;
                statusArea.className = `status-message ${isError ? 'error' : 'success'}`;
                statusArea.style.display = 'block';
                setTimeout(() => {
                    statusArea.style.display = 'none';
                }, 5000);
            };

            saveBtn.addEventListener('click', async () => {
                saveBtn.disabled = true;
                saveBtn.textContent = '儲存中...';

                const newPrompts = {};
                const textareas = promptsContainer.querySelectorAll('textarea');
                textareas.forEach(textarea => {
                    newPrompts[textarea.name] = textarea.value;
                });

                try {
                    const response = await fetch('/api/prompts', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(newPrompts),
                    });

                    const result = await response.json();
                    if (!response.ok) {
                        throw new Error(result.detail || '儲存失敗');
                    }
                    showStatusMessage(result.message || '儲存成功！');
                    originalPrompts = newPrompts; // Update original state
                } catch (error) {
                    showStatusMessage(`儲存失敗: ${error.message}`, true);
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.textContent = '儲存變更';
                }
            });

            // Initial load
            fetchPrompts();
        });
    </script>
</body>
</html>
