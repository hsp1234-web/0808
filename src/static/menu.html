<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能選單 - 音訊轉錄儀</title>
    <link rel="stylesheet" href="/static/shared/main.css">
    <style>
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }
        .menu-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            border-radius: 12px;
            background-color: #fff;
            border: 1px solid var(--card-border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.2s ease-in-out;
            text-align: center;
        }
        .menu-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border-color: var(--button-bg-color);
        }
        .menu-button .icon {
            font-size: 3em;
            margin-bottom: 12px;
        }
        .menu-button .title {
            font-size: 1.2em;
            font-weight: 600;
        }
        .menu-button .description {
            font-size: 0.9em;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="card">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <h1>功能選單</h1>
                <a href="/static/index.html" class="tab-button" style="background-color: #6c757d;">&larr; 返回儀表板</a>
            </div>
        </header>

        <div class="menu-grid">
            <a href="/static/transcribe.html" class="menu-button">
                <div class="icon">📁</div>
                <div class="title">本地檔案轉錄</div>
                <div class="description">上傳本機音訊或視訊檔案進行轉錄。</div>
            </a>
            <a href="/static/downloader.html" class="menu-button">
                <div class="icon">📥</div>
                <div class="title">媒體下載器</div>
                <div class="description">從 YouTube 等網站下載媒體檔案。</div>
            </a>
            <a href="/static/youtube_report.html" class="menu-button">
                <div class="icon">▶️</div>
                <div class="title">YouTube 轉報告</div>
                <div class="description">輸入 YouTube 網址，生成摘要和逐字稿。</div>
            </a>
            <a href="/static/prompts.html" class="menu-button">
                <div class="icon">📝</div>
                <div class="title">提示詞管理</div>
                <div class="description">管理用於 AI 分析的系統提示詞。</div>
            </a>
        </div>
    </div>
</body>
</html>
