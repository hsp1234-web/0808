<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地轉錄 - 音訊轉錄儀</title>
    <link rel="stylesheet" href="/static/shared/main.css">
</head>
<body>
    <div id="app" class="container">
        <!-- 全域標頭 (共享) -->
        <header class="global-header">
            <div class="header-top-row">
                <h1 id="page-title">本地檔案轉錄</h1>
                <div class="perf-dashboard">
                    <div class="stat-item">
                        <span id="status-light" class="status-light"></span>
                        <span id="status-text">連線中...</span>
                    </div>
                    <div class="stat-item" id="gpu-stat-container" style="display: none;">
                        <span>GPU</span>
                        <strong id="gpu-label">--%</strong>
                    </div>
                    <div class="stat-item">
                        <span>CPU</span>
                        <strong id="cpu-label">--%</strong>
                    </div>
                    <div class="stat-item">
                        <span>RAM</span>
                        <strong id="ram-label">--%</strong>
                    </div>
                </div>
            </div>
            <nav class="nav-buttons">
                <a href="/static/index.html" class="nav-button" data-page="index">儀表板</a>
                <a href="/static/transcribe.html" class="nav-button" data-page="transcribe">本地轉錄</a>
                <a href="/static/downloader.html" class="nav-button" data-page="downloader">媒體下載器</a>
                <a href="/static/youtube_report.html" class="nav-button" data-page="youtube_report">YouTube 報告</a>
                <a href="/static/prompts.html" class="nav-button" data-page="prompts">提示詞管理</a>
            </nav>
        </header>

        <!-- 狀態訊息區 (共享) -->
        <div id="status-message-area" class="card" style="display:none;">
            <div id="status-message-text"></div>
        </div>

        <!-- === 本地檔案轉錄專屬內容 === -->
        <div class="card">
             <h2>開始轉錄新檔案</h2>
            <div class="grid-2-col">
                <div class="flex-col">
                    <h3>⚙️ 步驟 1: 選項 (Whisper 模型)</h3>
                    <div>
                        <label for="model-select">模型大小</label>
                        <select id="model-select" class="form-select">
                            <option value="tiny" selected>Tiny (最快)</option>
                            <option value="base">Base</option>
                            <option value="small">Small</option>
                            <option value="medium">Medium (建議)</option>
                            <option value="large-v2">Large-v2 (準確)</option>
                            <option value="large-v3">Large-v3 (最準確)</option>
                        </select>
                    </div>
                    <div>
                        <label for="language-select">轉錄語言</label>
                        <select id="language-select" class="form-select">
                            <option value="zh">繁體中文</option>
                            <option value="en">英文</option>
                        </select>
                    </div>
                    <div>
                        <label for="beam-size-input" style="display: block; margin-bottom: 4px;">光束大小 (Beam Size)</label>
                        <input type="number" id="beam-size-input" value="1" min="1" max="10" class="form-input">
                        <small style="font-size: 0.8em; color: #666;">建議值為 5。較大的值可能更準確但較慢。</small>
                    </div>
                </div>
                <div class="flex-col">
                    <h3>📤 步驟 2: 上傳檔案</h3>
                    <label for="file-input" class="file-drop-zone">
                        點擊此處選擇檔案
                    </label>
                    <input id="file-input" type="file" multiple class="hidden">
                    <div id="file-list"></div>
                </div>
            </div>
            <div style="text-align: center; margin-top: 24px;">
                <button id="start-processing-btn" disabled>✨ 請先選擇檔案</button>
            </div>
        </div>
        <!-- === 專屬內容結束 === -->

        <!-- 即時轉錄輸出 -->
        <div id="transcript-container" class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <h2>📝 即時轉錄輸出</h2>
                <div class="toggle-switch-container" style="display: flex; align-items: center; gap: 8px;">
                    <label for="timestamp-toggle" style="font-weight: 500; font-size: 0.9em; cursor: pointer;">顯示時間戳記</label>
                    <input type="checkbox" id="timestamp-toggle" checked>
                </div>
            </div>
            <div id="transcript-output" class="transcript-output" style="margin-top: 16px;">等待任務開始...</div>
        </div>

        <!-- 處理中任務 (共享) -->
        <div class="card">
            <h3>🔄 處理中任務</h3>
            <div id="ongoing-tasks" class="task-list">
                <p>正在載入任務...</p>
            </div>
        </div>

        <!-- 已完成任務 (共享) -->
        <div class="card">
            <h3>✅ 已完成任務</h3>
            <div id="completed-tasks" class="task-list">
                <p>正在載入任務...</p>
            </div>
        </div>
        <!-- 在非報告頁，這個容器是隱藏的，但為了讓 JS 腳本正常運作而存在 -->
        <div id="youtube-file-browser" style="display: none;"></div>
    </div>

    <script type="module">
        import { AppInitializer } from '/static/shared/app.js';

        // 頁面專屬邏輯
        document.addEventListener('DOMContentLoaded', () => {
            const fileInput = document.getElementById('file-input');
            const fileDropZone = document.querySelector('.file-drop-zone');
            const fileListDisplay = document.getElementById('file-list');
            const startBtn = document.getElementById('start-processing-btn');
            const modelSelect = document.getElementById('model-select');
            const languageSelect = document.getElementById('language-select');
            const beamSizeInput = document.getElementById('beam-size-input');

            let uploadedFiles = [];

            function updateFileDisplay() {
                fileListDisplay.innerHTML = '';
                if (uploadedFiles.length === 0) {
                    fileListDisplay.innerHTML = '<p style="color: #666; text-align: center;">尚未選擇任何檔案</p>';
                } else {
                    uploadedFiles.forEach((file, index) => {
                        const fileElement = document.createElement('div');
                        fileElement.className = 'task-item';
                        fileElement.innerHTML = `<span class="task-filename" title="${file.name}">${file.name}</span><button data-index="${index}" class="remove-file-btn" style="background-color: #dc3545; padding: 3px 8px; font-size: 0.8em;">移除</button>`;
                        fileListDisplay.appendChild(fileElement);
                    });
                }
                startBtn.disabled = uploadedFiles.length === 0;
                startBtn.textContent = uploadedFiles.length > 0 ? `✨ 開始處理 ${uploadedFiles.length} 個檔案` : '✨ 請先選擇檔案';
            }

            fileListDisplay.addEventListener('click', (e) => {
                if (e.target.classList.contains('remove-file-btn')) {
                    const indexToRemove = parseInt(e.target.dataset.index, 10);
                    uploadedFiles.splice(indexToRemove, 1);
                    updateFileDisplay();
                }
            });

            function handleFiles(files) {
                 const newFiles = Array.from(files);
                newFiles.forEach(newFile => {
                    if (!uploadedFiles.some(existingFile => existingFile.name === newFile.name)) {
                        uploadedFiles.push(newFile);
                    }
                });
                updateFileDisplay();
            }

            fileInput.addEventListener('change', () => handleFiles(fileInput.files));
            fileDropZone.addEventListener('click', () => fileInput.click());
            fileDropZone.addEventListener('dragover', (e) => e.preventDefault());
            fileDropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                handleFiles(e.dataTransfer.files);
            });

            startBtn.addEventListener('click', async () => {
                if (uploadedFiles.length === 0) return;
                startBtn.disabled = true;
                startBtn.textContent = '正在建立任務...';

                for (const file of uploadedFiles) {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('model_size', modelSelect.value);
                    formData.append('language', languageSelect.value);
                    formData.append('beam_size', beamSizeInput.value);
                    try {
                        const response = await fetch('/api/transcribe', { method: 'POST', body: formData });
                        if (!response.ok) {
                            const error = await response.json();
                            throw new Error(error.detail || '上傳失敗');
                        }
                        AppInitializer.showStatusMessage(`任務 "${file.name}" 已成功建立！`, false);

                    } catch (error) {
                        AppInitializer.showStatusMessage(`處理檔案 ${file.name} 時發生錯誤: ${error.message}`, true);
                    }
                }
                uploadedFiles = [];
                updateFileDisplay();
            });

            updateFileDisplay();
        });

        // 初始化共享應用程式邏輯
        AppInitializer.init({ pageId: 'transcribe' });
    </script>

    <!-- Modals -->
    <div id="preview-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">預覽</h2>
                <button id="modal-close-btn" class="modal-close-button">&times;</button>
            </div>
            <div class="modal-body"></div>
            <div class="modal-footer">
                <button id="modal-copy-link-btn">複製連結</button>
            </div>
        </div>
    </div>

    <div id="details-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="details-modal-title">任務詳細資訊</h2>
                <button id="details-modal-close-btn" class="modal-close-button">&times;</button>
            </div>
            <div id="details-modal-body" class="modal-body"></div>
            <div class="modal-footer">
                 <button id="details-modal-ok-btn">確認</button>
            </div>
        </div>
    </div>
</body>
</html>
