<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儀表板 - 音訊轉錄儀</title>
    <link rel="stylesheet" href="/static/shared/main.css">
</head>
<body>
    <div id="app" class="container">
        <!-- 標題 -->
        <header class="card">
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
                <h1>音訊轉錄儀 - 儀表板</h1>
                <a href="/static/menu.html" class="tab-button">🚀 開始新任務</a>
            </div>
        </header>

        <!-- 狀態訊息區 -->
        <div id="status-message-area" class="card" style="display:none;">
            <div id="status-message-text"></div>
        </div>

        <!-- 全域儀表板 -->
        <div class="card">
            <h2>📊 全域儀表板</h2>
            <div id="dashboard-container" class="dashboard-grid">
                <div class="stat-item">
                    <span id="status-light" class="status-light"></span>
                    <span id="status-text">連線中...</span>
                </div>
                <div class="stat-item" id="gpu-stat-container" style="display: none;">
                    <span>GPU</span>
                    <strong id="gpu-label">--%</strong>
                </div>
                <div class="stat-item">
                    <span>CPU</span>
                    <strong id="cpu-label">--%</strong>
                </div>
                <div class="stat-item">
                    <span>RAM</span>
                    <strong id="ram-label">--%</strong>
                </div>
            </div>
        </div>

        <!-- 處理中任務 -->
        <div class="card">
            <h2>🔄 處理中任務</h2>
            <div id="ongoing-tasks" class="task-list">
                <p id="no-ongoing-task-msg">暫無執行中任務</p>
            </div>
        </div>

        <!-- 已完成任務 -->
        <div class="card">
            <h2>✅ 已完成任務</h2>
            <div id="completed-tasks" class="task-list">
                <p id="no-completed-task-msg">尚無完成的任務</p>
            </div>
        </div>

        <!-- Modal 彈窗 (共享) -->
        <div id="preview-modal" class="modal-overlay" style="display: none;">
            <!-- Modal 結構... -->
        </div>
    </div>

    <script type="module">
        import { AppInitializer } from '/static/shared/app.js';
        AppInitializer.init();
    </script>
</body>
</html>
