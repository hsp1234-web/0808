<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒體下載器 - 音訊轉錄儀</title>
    <link rel="stylesheet" href="/static/shared/main.css">
</head>
<body>
    <div id="app" class="container">
        <!-- 標題 -->
        <header class="card">
            <h1>音訊轉錄儀 - 媒體下載器</h1>
        </header>

        <!-- 狀態訊息區 (共享) -->
        <div id="status-message-area" class="card" style="display:none;">
            <div id="status-message-text"></div>
        </div>

        <!-- 導覽列 (共享) -->
        <nav class="card">
            <div class="tab-container">
                <a href="/static/index.html" class="tab-button">📊 儀表板</a>
                <a href="/static/transcribe.html" class="tab-button">📁 本地轉錄</a>
                <a href="/static/downloader.html" class="tab-button active">📥 媒體下載器</a>
                <a href="/static/youtube_report.html" class="tab-button">▶️ YouTube 轉報告</a>
                <a href="/static/prompts.html" class="tab-button">📝 提示詞管理</a>
            </div>
        </nav>

        <!-- 全域儀表板 (共享) -->
        <div class="card">
            <h2>📊 全域儀表板</h2>
            <div id="dashboard-container" class="dashboard-grid">
                <div class="stat-item">
                    <span id="status-light" class="status-light"></span>
                    <span id="status-text">連線中...</span>
                </div>
                <div class="stat-item" id="gpu-stat-container">
                    <span>GPU</span>
                    <strong id="gpu-label">--%</strong>
                </div>
                <div class="stat-item">
                    <span>CPU</span>
                    <strong id="cpu-label">--%</strong>
                </div>
                <div class="stat-item">
                    <span>RAM</span>
                    <strong id="ram-label">--%</strong>
                </div>
            </div>
        </div>

        <!-- === 媒體下載器專屬內容 === -->
        <div class="card">
            <h2>📥 媒體下載器</h2>
            <div class="grid-2-col">
                <!-- 左側：輸入與主要控制 -->
                <div class="flex-col">
                    <div>
                        <label for="downloader-urls-input"><strong>網址或播放清單</strong> (可輸入多個，每行一個)</label>
                        <textarea id="downloader-urls-input" rows="5" placeholder="支援 YouTube, Facebook, Bilibili 等多數影音網站..." class="form-input"></textarea>
                    </div>
                    <div style="text-align: center; margin-top: 16px;">
                        <button id="start-download-btn" style="width: 100%; padding: 12px; font-size: 1.1em;">開始下載</button>
                    </div>
                </div>
                <!-- 右側：詳細選項 -->
                <div class="flex-col">
                    <div>
                        <label><strong>下載類型</strong></label>
                        <div style="display: flex; gap: 20px; margin-top: 8px;">
                            <label><input type="radio" name="download-type" value="audio" checked> 純音訊</label>
                            <label><input type="radio" name="download-type" value="video"> 影片</label>
                        </div>
                    </div>

                    <!-- 音訊選項 -->
                    <div id="audio-options">
                        <label for="audio-format-select"><strong>音訊格式</strong></label>
                        <select id="audio-format-select" class="form-select">
                            <option value="m4a">M4A (原生格式, 速度最快)</option>
                            <option value="mp3">MP3 (需轉檔, 相容性高)</option>
                            <option value="wav">WAV (需轉檔, 無損)</option>
                            <option value="flac">FLAC (需轉檔, 無損壓縮)</option>
                        </select>
                    </div>

                    <!-- 影片選項 (預設隱藏) -->
                    <div id="video-options" class="hidden">
                        <label for="video-quality-select"><strong>影片畫質</strong></label>
                        <select id="video-quality-select" class="form-select">
                            <option value="best">最佳畫質</option>
                            <option value="1080p">1080p</option>
                            <option value="720p">720p (HD)</option>
                            <option value="480p">480p (SD)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- 下載列表 -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
                <h2>📋 下載佇列與歷史紀錄</h2>
                <button id="zip-download-btn" disabled style="background-color: #28a745;">打包下載選定項目 (.zip)</button>
            </div>
            <div id="downloader-tasks" class="task-list" style="margin-top: 16px;">
                <p id="no-downloader-task-msg">暫無下載任務</p>
            </div>
        </div>
        <!-- === 專屬內容結束 === -->

        <!-- 處理中任務 (共享) -->
        <div class="card">
            <h2>🔄 處理中任務</h2>
            <div id="ongoing-tasks" class="task-list">
                <p id="no-ongoing-task-msg">暫無執行中任務</p>
            </div>
        </div>

        <!-- 已完成任務 (共享) -->
        <div class="card">
            <h2>✅ 已完成任務</h2>
            <div id="completed-tasks" class="task-list">
                <p id="no-completed-task-msg">尚無完成的任務</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { AppInitializer } from '/static/shared/app.js';

        // 頁面專屬邏輯
        document.addEventListener('DOMContentLoaded', () => {
            const startDownloadBtn = document.getElementById('start-download-btn');
            const downloaderUrlsInput = document.getElementById('downloader-urls-input');
            const downloadTypeRadios = document.querySelectorAll('input[name="download-type"]');
            const audioOptions = document.getElementById('audio-options');
            const videoOptions = document.getElementById('video-options');

            downloadTypeRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    const isAudio = e.target.value === 'audio';
                    audioOptions.classList.toggle('hidden', !isAudio);
                    videoOptions.classList.toggle('hidden', isAudio);
                });
            });

            startDownloadBtn.addEventListener('click', async () => {
                const urls = downloaderUrlsInput.value.split('\\n').map(u => u.trim()).filter(u => u);
                if (urls.length === 0) {
                    AppInitializer.showStatusMessage('請輸入至少一個網址。', true);
                    return;
                }

                const requests = urls.map(url => ({ url, filename: '' }));
                const downloadType = document.querySelector('input[name="download-type"]:checked').value;

                const payload = {
                    requests: requests,
                    download_only: true,
                    model: null,
                    download_type: downloadType,
                    // 可以在這裡添加音訊/影片格式等選項
                };

                startDownloadBtn.disabled = true;
                startDownloadBtn.textContent = '正在建立任務...';

                try {
                    const response = await fetch('/api/youtube/process', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error((await response.json()).detail || '建立下載任務失敗');

                    downloaderUrlsInput.value = '';
                } catch (error) {
                    AppInitializer.showStatusMessage(`處理下載任務時發生錯誤: ${error.message}`, true);
                } finally {
                    startDownloadBtn.disabled = false;
                    startDownloadBtn.textContent = '開始下載';
                }
            });
        });

        // 初始化共享應用程式邏輯
        AppInitializer.init();
    </script>
</body>
</html>
